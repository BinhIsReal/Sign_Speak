<!doctype html>
<html lang="vi" class="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("app_theme") === "dark")
            document.documentElement.classList.add("dark");
          if (localStorage.getItem("sidebar_collapsed") === "true")
            document.documentElement.classList.add("sidebar-collapsed-root");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Tài khoản | Sign Speak</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      try {
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                primary: "#005bb3",
                "primary-container": "#0073df",
                surface: "#f8fafc",
                "on-surface": "#0f172a",
                "on-surface-variant": "#64748b",
                background: "#f8fafc",
                error: "#ba1a1a",
                "error-container": "#ffdad6",
              },
            },
          },
        };
      } catch (_e) {}
    </script>
    <link rel="stylesheet" href="css/style.css?v=2.5.0" />
    <script src="js/services/security_guard.js?v=2.5.0"></script>
    <script src="js/sidebar_component.js?v=2.5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/services/supabase_client.js?v=2.5.0"></script>
    <script src="js/services/push_notification_service.js?v=2.5.0"></script>
    <script src="js/services/global_call_listener.js?v=2.5.0"></script>
    <script src="js/menu_controller.js?v=2.5.0"></script>
  </head>
  <body class="flex min-h-screen bg-background text-on-surface antialiased">
    <!-- Left Navigation Sidebar Component -->
    <div id="sidebarContainer"></div>

    <!-- Main Content Shell -->
    <main class="ml-64 flex-1 flex flex-col min-h-screen bg-slate-50/50 dark:bg-[#0b1120] pb-20">
      <!-- Top App Bar -->
      <header class="flex justify-between items-center w-full px-6 h-16 bg-white dark:bg-[#151e32] border-b border-slate-200/80 dark:border-slate-800 messenger-shadow shrink-0 z-10">
        <div class="flex items-center gap-3">
          <h1 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">Menu Tài khoản</h1>
        </div>
      </header>

      <!-- Account Menu Scroll Container -->
      <div class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 max-w-2xl mx-auto w-full">
        <!-- User Profile Card Header -->
        <div class="flex flex-col items-center py-6 bg-white dark:bg-[#151e32] rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm relative">
          <div class="relative mb-3">
            <div id="menuUserAvatar" class="w-20 h-20 rounded-full bg-primary text-white font-extrabold text-2xl flex items-center justify-center shadow-lg border-4 border-white dark:border-slate-800 overflow-hidden">
              --
            </div>
            <span class="absolute bottom-0 right-0 w-4 h-4 rounded-full bg-emerald-500 border-2 border-white dark:border-slate-800"></span>
          </div>
          <h2 id="menuUserName" class="text-lg font-bold text-slate-900 dark:text-white">Đang tải...</h2>
          <p id="menuUserEmail" class="text-xs text-slate-500 dark:text-slate-400 font-medium">@user</p>
        </div>

        <!-- Section 1: Account Management -->
        <div class="bg-white dark:bg-[#151e32] rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden">
          <a href="profile.html" class="w-full flex items-center justify-between p-5 px-6 hover:bg-slate-50 dark:hover:bg-slate-800 active:scale-95 transition-all">
            <div class="flex items-center gap-3.5">
              <div class="w-10 h-10 flex items-center justify-center bg-primary/10 text-primary rounded-2xl shrink-0">
                <span class="material-symbols-outlined text-[22px]">person</span>
              </div>
              <span class="text-sm font-bold text-slate-900 dark:text-white">Thông tin tài khoản</span>
            </div>
            <span class="material-symbols-outlined text-slate-400 text-[20px] shrink-0 ml-auto">chevron_right</span>
          </a>
        </div>

        <!-- Section 2: Settings & Preferences -->
        <div class="bg-white dark:bg-[#151e32] rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden divide-y divide-slate-100 dark:divide-slate-800">
          <div class="px-5 pt-4 pb-2">
            <span class="text-[11px] font-bold text-primary uppercase tracking-wider">Cài đặt & Giao diện</span>
          </div>

          <!-- Feature Button: Cài đặt ứng dụng -->
          <a href="settings.html" class="w-full flex items-center justify-between gap-3 p-4 hover:bg-slate-50 dark:hover:bg-slate-800 active:scale-95 transition-all">
            <div class="flex items-center gap-3.5 min-w-0 flex-1">
              <div class="w-10 h-10 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-2xl shrink-0">
                <span class="material-symbols-outlined text-[22px]">settings</span>
              </div>
              <div class="flex flex-col min-w-0 pr-1">
                <span class="text-xs font-bold text-slate-900 dark:text-white truncate">Cài đặt ứng dụng & Phụ đề</span>
                <span class="text-[11px] text-slate-500 dark:text-slate-400 truncate">Kích thước chữ, phụ đề, âm thanh</span>
              </div>
            </div>
            <span class="material-symbols-outlined text-slate-400 text-[20px] shrink-0 ml-auto">chevron_right</span>
          </a>

          <!-- Quick Theme Toggle Row -->
          <div class="flex items-center justify-between p-4">
            <div class="flex items-center gap-3.5">
              <div class="w-10 h-10 flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-2xl shrink-0">
                <span class="material-symbols-outlined text-[22px]">dark_mode</span>
              </div>
              <span class="text-xs font-bold text-slate-900 dark:text-white">Chế độ giao diện (Theme)</span>
            </div>
            <div class="flex bg-slate-100 dark:bg-slate-800 rounded-full p-1 border border-slate-200/60 dark:border-slate-700">
              <button id="menuLightThemeBtn" class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all" title="Chế độ Sáng">
                <span class="material-symbols-outlined text-[18px]">light_mode</span>
              </button>
              <button id="menuDarkThemeBtn" class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all" title="Chế độ Tối">
                <span class="material-symbols-outlined text-[18px]">dark_mode</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Section 3: Logout & App Info -->
        <div class="bg-white dark:bg-[#151e32] rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden p-3">
          <button id="menuLogoutBtn" class="w-full py-3.5 px-4 rounded-2xl bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 dark:hover:bg-rose-950/60 text-rose-600 dark:text-rose-400 font-bold text-xs active:scale-95 transition-all flex items-center justify-center gap-2 cursor-pointer">
            <span class="material-symbols-outlined text-[18px]">logout</span>
            <span>Đăng xuất tài khoản</span>
          </button>
        </div>

        <!-- App Version -->
        <div class="text-center pt-2 pb-6">
          <p class="text-[11px] font-semibold text-slate-400 dark:text-slate-500">Sign Speak v2.4.0 • Hệ thống giao tiếp đa phương thức</p>
        </div>
      </div>
    </main>
  </body>
</html>
