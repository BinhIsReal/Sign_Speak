<!doctype html>
<html lang="vi" class="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("app_theme") === "dark")
            document.documentElement.classList.add("dark");
          if (localStorage.getItem("sidebar_collapsed") === "true")
            document.documentElement.classList.add("sidebar-collapsed-root");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bạn bè | Sign Speak</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="css/style.css?v=2.5.0" />
    <script src="js/services/security_guard.js?v=2.5.0"></script>
    <script src="js/sidebar_component.js?v=2.5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/services/supabase_client.js?v=2.5.0"></script>
    <script src="js/services/push_notification_service.js?v=2.5.0"></script>
    <script src="js/services/global_call_listener.js?v=2.5.0"></script>
    <script src="js/contacts_controller.js?v=2.5.0"></script>
  </head>
  <body
    class="bg-background text-on-background font-body-md selection:bg-primary/20 antialiased overflow-hidden"
  >
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary": "#ffffff",
              "surface-container-high": "#e5e8f2",
              surface: "#f8fafc",
              "on-primary": "#ffffff",
              "tertiary-fixed-dim": "#6dd2ff",
              "on-surface": "#0f172a",
              primary: "#005bb3",
              "surface-variant": "#e2e8f0",
              "on-surface-variant": "#64748b",
              "on-secondary-container": "#fff6ff",
              "surface-container-highest": "#e2e8f0",
              "surface-container": "#f1f5f9",
              "tertiary-fixed": "#bfe9ff",
              "surface-container-low": "#f8fafc",
              outline: "#717786",
              "inverse-surface": "#2d3038",
              "inverse-primary": "#a9c7ff",
              "surface-tint": "#005db7",
              error: "#ba1a1a",
              "on-tertiary-fixed": "#001f2a",
              "error-container": "#ffdad6",
              tertiary: "#006482",
              "on-primary-fixed": "#001b3d",
              "tertiary-container": "#007ea4",
              secondary: "#8300de",
              background: "#f8fafc",
              "on-tertiary-container": "#fbfdff",
              "surface-container-lowest": "#ffffff",
              "on-error-container": "#93000a",
              "primary-container": "#0073df",
              "secondary-fixed": "#f0dbff",
              "on-tertiary-fixed-variant": "#004d65",
              "primary-fixed": "#d6e3ff",
              "on-primary-fixed-variant": "#00468c",
              "on-background": "#0f172a",
              "on-primary-container": "#fefcff",
              "inverse-on-surface": "#eef0fb",
              "surface-bright": "#f8fafc",
              "secondary-fixed-dim": "#ddb7ff",
              "surface-dim": "#d7dae4",
              "secondary-container": "#9f32fe",
              "on-error": "#ffffff",
              "primary-fixed-dim": "#a9c7ff",
              "outline-variant": "#c0c6d6",
              "on-secondary-fixed": "#2c0050",
              "on-secondary-fixed-variant": "#6900b3",
              "on-secondary": "#ffffff",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "1rem",
              full: "9999px",
            },
            fontFamily: {
              "label-md": ["Outfit"],
              "headline-md": ["Outfit"],
              "headline-lg": ["Outfit"],
              display: ["Outfit"],
              caption: ["Outfit"],
              "body-md": ["Outfit"],
              "body-lg": ["Outfit"],
            },
          },
        },
      };
    </script>
    <div class="flex h-screen overflow-hidden">
      <!-- Left Navigation Sidebar Component -->
      <div id="sidebarContainer"></div>

      <!-- Main Content Area -->
      <main
        class="content-transition ml-64 flex-1 flex flex-col h-full bg-slate-50/50"
        id="main-content"
      >
        <!-- TopAppBar -->
        <header
          class="flex justify-between items-center w-full px-8 h-16 bg-white border-b border-slate-200/80 messenger-shadow shrink-0 z-10"
        >
          <div class="flex items-center gap-6 flex-1 max-w-xl">
            <div class="relative w-full">
              <span
                class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-[18px]"
                >search</span
              >
              <input
                id="searchInput"
                class="w-full pl-10 pr-4 py-2 bg-slate-100/80 border border-slate-200/50 rounded-full text-sm focus:ring-2 focus:ring-primary/20 focus:bg-white placeholder:text-slate-400 transition-all"
                placeholder="Tìm kiếm bạn bè..."
                type="text"
              />
            </div>
          </div>
          <div class="flex items-center gap-4">
            <nav
              class="hidden lg:flex items-center gap-5 mr-2 text-xs font-semibold"
            >
              <a
                id="tabFriendsBtn"
                class="text-primary font-bold border-b-2 border-primary pb-1 text-xs cursor-pointer flex items-center gap-1"
                href="#"
              >
                <span>Bạn bè</span>
              </a>
              <a
                id="tabRequestsBtn"
                class="text-slate-500 hover:text-primary transition-colors text-xs font-semibold cursor-pointer flex items-center gap-1.5"
                href="#"
              >
                <span>Lời mời kết bạn</span>
                <span
                  id="requestsCountBadge"
                  class="hidden px-2 py-0.5 rounded-full bg-rose-500 text-white font-bold text-[10px]"
                  >0</span
                >
              </a>
            </nav>

            <!-- Notification Bell Button & Dropdown Container -->
            <div class="relative">
              <button
                id="notifBellBtn"
                class="relative w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-200 transition-all active:scale-95 cursor-pointer shadow-sm"
                title="Thông báo lời mời kết bạn"
              >
                <span class="material-symbols-outlined text-[22px]">notifications</span>
                <span
                  id="notifBadgeCount"
                  class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-600 text-white font-bold text-[10px] flex items-center justify-center border-2 border-white dark:border-slate-900 shadow-sm"
                  >0</span
                >
              </button>

              <!-- Notifications Dropdown List (Fixed Width 360px, Glassmorphism, Dark & Light Theme) -->
              <div
                id="notifDropdown"
                class="hidden absolute right-0 mt-2 w-[340px] sm:w-[380px] bg-white dark:bg-[#151e32] rounded-3xl border border-slate-200/90 dark:border-slate-800 shadow-2xl z-50 p-4 space-y-3 animate-in fade-in slide-in-from-top-2 duration-200"
              >
                <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                  <h4 class="text-xs font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <div class="w-7 h-7 rounded-lg bg-primary/10 text-primary flex items-center justify-center">
                      <span class="material-symbols-outlined text-[18px]">notifications</span>
                    </div>
                    <span>Thông báo lời mời</span>
                  </h4>
                  <span
                    id="notifDropdownCount"
                    class="text-[11px] font-bold text-primary dark:text-sky-400 bg-primary/10 dark:bg-sky-400/10 px-2.5 py-0.5 rounded-full"
                    >0 lời mời mới</span
                  >
                </div>
                <div
                  id="notifDropdownList"
                  class="max-h-72 overflow-y-auto space-y-2.5 pr-0.5 custom-scrollbar"
                >
                  <!-- Dynamically rendered notification items -->
                </div>
              </div>
            </div>
          </div>
        </header>

        <!-- Contacts Canvas -->
        <div class="flex-1 overflow-y-auto p-8 space-y-8">
          <!-- Section: Active Now Strip -->
          <section
            class="bg-white p-6 rounded-3xl border border-slate-200/70 shadow-sm"
          >
            <div class="flex items-center justify-between mb-4">
              <h2
                class="text-base font-bold text-slate-900 flex items-center gap-2"
              >
                <span
                  class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"
                ></span>
                <span>Đang hoạt động trực tuyến</span>
              </h2>
            </div>
            <div
              id="onlineStrip"
              class="flex gap-6 overflow-x-auto pb-2 scroll-smooth"
            >
              <div
                class="py-4 text-center text-slate-400 text-xs font-medium w-full"
              >
                Chưa có bạn bè nào trực tuyến. Hãy kết bạn mới ở danh sách bên dưới!
              </div>
            </div>
          </section>

          <!-- Section: All Contacts Grid -->
          <section>
            <div class="flex items-center justify-between mb-5">
              <h2 class="text-lg font-bold text-slate-900 tracking-tight">
                Danh sách liên hệ
              </h2>
            </div>
            <div
              class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"
              id="contactsGrid"
            >
              <!-- Dynamically rendered contacts -->
            </div>
          </section>

          <!-- Section: Suggested Friends -->
          <section class="pt-2">
            <div class="flex items-center justify-between mb-4">
              <h2
                class="text-base font-bold text-slate-900 tracking-tight flex items-center gap-2"
              >
                <span class="material-symbols-outlined text-primary text-lg"
                  >group_add</span
                >
                <span>Gợi ý kết bạn dành cho bạn</span>
              </h2>
            </div>
            <div
              class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"
              id="suggestedGrid"
            >
              <!-- Dynamically populated by contacts_controller.js -->
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- Notification Toast Banner -->
    <div
      id="notifToast"
      class="hidden fixed bottom-6 right-6 z-50 p-4 rounded-2xl bg-slate-900 text-white font-bold text-xs shadow-2xl border border-slate-700"
    >
      🎉 Đã gửi lời mời kết bạn thành công!
    </div>
  </body>
</html>
