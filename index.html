<!doctype html>
<html lang="vi" class="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("app_theme") === "dark")
            document.documentElement.classList.add("dark");
          if (localStorage.getItem("sidebar_collapsed") === "true")
            document.documentElement.classList.add("sidebar-collapsed-root");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tin nhắn | Sign Speak</title>
    <!-- CDN Preconnect & DNS Prefetch -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      try {
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "on-tertiary": "#ffffff",
                "surface-container-high": "#e5e8f2",
                surface: "#f8fafc",
                "on-primary": "#ffffff",
                "tertiary-fixed-dim": "#6dd2ff",
                "on-surface": "#0f172a",
                primary: "#005bb3",
                "surface-variant": "#e2e8f0",
                "on-surface-variant": "#64748b",
                "on-secondary-container": "#fff6ff",
                "surface-container-highest": "#e2e8f0",
                "surface-container": "#f1f5f9",
                "tertiary-fixed": "#bfe9ff",
                "surface-container-low": "#f8fafc",
                outline: "#717786",
                "inverse-surface": "#2d3038",
                "inverse-primary": "#a9c7ff",
                "surface-tint": "#005db7",
                error: "#ba1a1a",
                "on-tertiary-fixed": "#001f2a",
                "error-container": "#ffdad6",
                tertiary: "#006482",
                "on-primary-fixed": "#001b3d",
                "tertiary-container": "#007ea4",
                secondary: "#8300de",
                background: "#f8fafc",
                "on-tertiary-container": "#fbfdff",
                "surface-container-lowest": "#ffffff",
                "on-error-container": "#93000a",
                "primary-container": "#0073df",
                "secondary-fixed": "#f0dbff",
                "on-secondary-fixed-variant": "#004d65",
                "primary-fixed": "#d6e3ff",
                "on-primary-fixed-variant": "#00468c",
                "on-background": "#0f172a",
                "on-primary-container": "#fefcff",
                "inverse-on-surface": "#eef0fb",
                "surface-bright": "#f8fafc",
                "secondary-fixed-dim": "#ddb7ff",
                "surface-dim": "#d7dae4",
                "secondary-container": "#9f32fe",
                "on-error": "#ffffff",
                "primary-fixed-dim": "#a9c7ff",
                "outline-variant": "#c0c6d6",
                "on-secondary-fixed": "#2c0050",
                "on-secondary-fixed-variant": "#6900b3",
                "on-secondary": "#ffffff",
              },
              borderRadius: {
                DEFAULT: "0.25rem",
                lg: "0.5rem",
                xl: "1rem",
                full: "9999px",
              },
              spacing: {
                gutter: "16px",
                "margin-mobile": "16px",
                md: "16px",
                xs: "8px",
                lg: "24px",
                "margin-desktop": "24px",
                base: "4px",
                xl: "32px",
                sm: "12px",
              },
              fontFamily: {
                "label-md": ["Outfit"],
                "headline-md": ["Outfit"],
                "headline-lg": ["Outfit"],
                display: ["Outfit"],
                caption: ["Outfit"],
                "body-md": ["Outfit"],
                "body-lg": ["Outfit"],
              },
            },
          },
        };
      } catch (_e) {}
    </script>
    <link rel="stylesheet" href="css/style.css?v=2.5.0" />
    <script src="js/services/security_guard.js?v=2.5.0"></script>
    <script src="js/sidebar_component.js?v=2.5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/services/supabase_client.js?v=2.5.0"></script>
    <script src="js/services/push_notification_service.js?v=2.5.0"></script>
    <script src="js/services/global_call_listener.js?v=2.5.0"></script>
    <script src="js/services/context_resolver.js?v=2.5.0"></script>
    <script src="js/chat_controller.js?v=2.5.0"></script>
  </head>
  <body
    class="flex h-screen bg-background text-on-surface antialiased overflow-hidden"
  >
    <!-- Left Navigation Sidebar Component -->
    <div id="sidebarContainer"></div>

    <!-- Main Content Shell -->
    <main class="ml-64 flex flex-grow h-full">
      <!-- Pane 2: Conversation List -->
      <section class="w-96 flex flex-col border-r border-slate-200/80 bg-white">
        <div class="p-6 flex flex-col gap-4">
          <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold text-slate-900 tracking-tight">
              Trò chuyện Realtime
            </h2>
            <span
              id="conversationsCountBadge"
              class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-semibold"
              >0 hội thoại</span
            >
          </div>
          <!-- Search Bar -->
          <div class="relative">
            <span
              class="absolute left-3.5 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400 text-[18px]"
              data-icon="search"
              >search</span
            >
            <input
              id="conversationsSearchInput"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-100/80 border border-slate-200/50 rounded-full text-sm focus:ring-2 focus:ring-primary/20 focus:bg-white placeholder:text-slate-400 transition-all"
              placeholder="Tìm kiếm đoạn chat..."
              type="text"
            />
          </div>
        </div>

        <!-- Conversation List Container -->
        <div
          id="conversationsList"
          class="flex-grow overflow-y-auto px-3 space-y-2"
        >
          <!-- Dynamically populated by chat_controller.js -->
        </div>
      </section>

      <!-- Pane 3: Active Chat Window -->
      <section class="flex-grow flex flex-col relative bg-slate-50/50">
        <!-- TopAppBar -->
        <header
          class="h-16 flex justify-between items-center px-6 bg-white border-b border-slate-200/80 z-10 messenger-shadow shrink-0"
        >
          <div class="flex items-center gap-3.5 min-w-0">
            <!-- Mobile Back Button -->
            <button
              id="mobileBackToConversationsBtn"
              class="md:hidden p-2 -ml-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center cursor-pointer shrink-0"
              title="Quay lại danh sách trò chuyện"
            >
              <span class="material-symbols-outlined text-[24px]">arrow_back</span>
            </button>

            <div class="relative shrink-0">
              <div
                id="activeChatAvatar"
                class="w-10 h-10 rounded-full bg-primary text-white font-bold flex items-center justify-center shadow-md text-sm border border-primary/20"
              >
                --
              </div>
              <span
                class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-emerald-500 border-2 border-white"
              ></span>
            </div>
            <div class="flex flex-col min-w-0">
              <span
                id="activeChatName"
                class="text-sm font-bold text-slate-900 truncate"
                >Chọn người dùng để nhắn tin</span
              >
              <span
                id="activeChatSub"
                class="text-[11px] text-slate-500 font-semibold truncate flex items-center gap-1"
              >
                <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                <span>Trò chuyện Realtime</span>
              </span>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <a
              id="activeVideoCallLink"
              href="call.html"
              class="px-4 py-2 rounded-full bg-primary hover:bg-primary-container text-white font-bold text-xs shadow-md shadow-primary/20 transition-all flex items-center gap-1.5"
            >
              <span class="material-symbols-outlined text-[18px]"
                >videocam</span
              >
              <span>Bắt đầu cuộc gọi Video</span>
            </a>
          </div>
        </header>

        <!-- Chat Content Stream -->
        <div
          class="flex-grow overflow-y-auto p-6 flex flex-col gap-5"
          id="chatStream"
        >
          <!-- Dynamically populated by chat_controller.js -->
        </div>

        <!-- Message Input Bar -->
        <footer class="p-3 md:p-4 bg-white dark:bg-[#151e32] border-t border-slate-200/80 dark:border-slate-800 shrink-0 w-full max-w-full box-border">
          <form id="chatForm" class="flex items-center gap-2.5 w-full max-w-full box-border">
            <input
              id="chatMessageInput"
              class="flex-1 min-w-0 w-full py-3 px-4 md:px-5 bg-slate-100/80 dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700 rounded-full text-sm dark:text-white focus:ring-2 focus:ring-primary/20 focus:bg-white placeholder:text-slate-400 transition-all box-border"
              placeholder="Nhập tin nhắn..."
              type="text"
              autocomplete="off"
            />
            <button
              id="sendMessageBtn"
              type="submit"
              class="px-4 md:px-5 py-3 bg-primary text-white rounded-full font-bold text-xs shadow-md shadow-primary/20 hover:scale-105 active:scale-95 transition-all flex items-center gap-1.5 shrink-0 ml-auto"
            >
              <span class="material-symbols-outlined text-[18px]">send</span>
              <span>Gửi</span>
            </button>
          </form>
        </footer>
      </section>
    </main>
  </body>
</html>
